name: Generate Summary (Implementation)

on:
  workflow_dispatch:
  workflow_call:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout stats-data branch
        uses: actions/checkout@v4
        with:
          ref: stats-data

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip packages
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-summary
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas matplotlib

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Get scripts from main branch
        run: |
          git fetch origin main
          git checkout origin/main -- generate_csv.py generate_graphs.py

      - name: Generate CSV from all stats files
        run: |
          python generate_csv.py -o summarized.csv

      - name: Generate graphs from CSV
        run: |
          python generate_graphs.py -i summarized.csv -o .

      - name: Update README with graphs
        run: |
          cat > README.md << 'EOF'
          # Merge Queue Statistics

          This branch contains automated merge queue statistics collected every 30 minutes.

          ## Average PRs by Hour of Day (PST)

          ### Last Day
          ![PRs by Hour - Last Day](prs_by_hour_last_day.png)

          ### Last Week
          ![PRs by Hour - Last Week](prs_by_hour_last_week.png)

          ### Last Month
          ![PRs by Hour - Last Month](prs_by_hour_last_month.png)

          ### All Time
          ![PRs by Hour - All Time](prs_by_hour_all.png)

          ## Files

          - `summarized.csv` - CSV summary of all collected statistics
          - `prs_by_hour_*.png` - Graphs showing average PRs by hour of day for different time periods
          - `stats/YYYY-MM/merge_queue_YYYYMMDD_HHMMSS.json` - Individual JSON stats files organized by month
          EOF

      - name: Commit summary, graphs, and README
        run: |
          git add summarized.csv prs_by_hour_*.png README.md
          # Only commit if there are changes
          git diff --staged --quiet || git commit -m "Update summary: CSV, graphs, and README"

      - name: Push to stats-data branch
        run: |
          git push origin stats-data
